<h1>The Eray Balat files</h1>
<p>Director and editor in Kayseri, Türkiye. Every film on this wall is shown with the evidence of how it was made. This page needs JavaScript; here is the short version.</p>
<ol>
<li><b>TennisCut</b>: three launch ads for a tennis app. An emotion film, a proof film, a story film.</li>
<li><b>Novora</b>: a 28-second animated pilot for an olive producer in Sölöz, Bursa. Turkish and English.</li>
<li><b>The Duffel</b>: a fashion film for an embroidered leather duffel.</li>
<li><b><a href="/flawless/">FLAWLESS</a></b>: a 16:56 documentary on the 2003 Antwerp diamond heist, with Leonardo Notarbartolo.</li>
<li><b>COLD START</b>: a 2:04 sci-fi trailer for an XPRIZE submission, cut from 35 generated clips.</li>
<li><b><a href="/bushido/">Bushido</a></b>: a campaign concept with a synthetic cast of two.</li>
<li><b>Music videos</b> for Modd, released by Universal Music Türkiye.</li>
<li><b>Real footage</b>: short films shot on a camera, including Boomerang (Honorable Mention, Student Video Contest 2026).</li>
</ol>
